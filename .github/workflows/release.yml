name: Release

# Push a tag like "1.20" to build, publish to the VS Marketplace (overview
# from ReadMe.md included), and attach the .vsix to a GitHub Release.
# Run manually (workflow_dispatch) for a build-only dry run that never publishes.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: windows-2022

    env:
      Configuration: Release
      Solution: VSTextMacros.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            # Manual dry run: use whatever is currently in the manifest
            $identity = Get-Content source.extension.vsixmanifest | Select-String '<Identity'
            $v = [regex]::Match($identity, '(\d+\.\d+)').Groups[1].Value
          }
          if ($v -notmatch '^\d+\.\d+$') { throw "Unexpected version '$v' (expected N.N, e.g. from tag 1.20)" }
          Write-Host "Version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Stamp version into source
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./bump-version.ps1 -newVersion ${{ steps.version.outputs.version }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore $env:Solution

      - name: Build VSIX
        run: msbuild $env:Solution /p:Configuration=$env:Configuration /p:DeployExtension=false /m

      - name: Locate VSIX
        id: vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path bin -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { throw "No .vsix produced under bin/" }
          Write-Host "VSIX: $($vsix.FullName)"
          "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSTextMacros-${{ steps.version.outputs.version }}
          path: ${{ steps.vsix.outputs.path }}

      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) { throw "Secret VS_MARKETPLACE_PAT is not set" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $publisher = Join-Path $vsPath 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          if (-not (Test-Path $publisher)) { throw "VsixPublisher.exe not found at $publisher" }
          & $publisher publish `
            -payload "${{ steps.vsix.outputs.path }}" `
            -publishManifest "publishManifest.json" `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed with exit code $LASTEXITCODE" }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
